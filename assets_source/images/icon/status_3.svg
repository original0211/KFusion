<?xml version="1.0" encoding="UTF-8"?>
<!-- KFusion tray status: disc with a white-filled crescent bite at
     the lower left (bite circle r=38.7 at (33.7,168.5)); fill encodes
     run state, an outer ring the mode. The bite is never a cutout. -->
<svg width="108" height="108" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <title>status_3</title>
  <defs>
    <clipPath id="disc-clip"><circle cx="120" cy="120" r="102"/></clipPath>
  </defs>
  <circle cx="120" cy="120" r="102" fill="#181818"/>
  <g clip-path="url(#disc-clip)">
    <circle cx="40" cy="165" r="35.9" fill="#FFFFFF"/>
  </g>
  <circle cx="120" cy="120" r="112.5" fill="none" stroke="#FFB02E" stroke-width="9"/>
</svg>
